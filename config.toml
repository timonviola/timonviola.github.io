base_url = "https://tmon.xyz"
title = "another devlog"
description = "python rust lua go nvim"
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false            # Keep this false, as it may cause issues with some styles
build_search_index = false            # Keep this false, search is temporarily unsupported
generate_feeds = true                # Whether to generate a feed file in root, read docs for more info about rss feed
feed_filenames = ["rss.xml"]
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown]
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=========================================================================================
[extra]

sections = [
    { name = "💾 devlog", path = "/devlog", is_external = false },
    { name = "🏷️ tags", path = "/tags", is_external = false },
]
blog_section_path = "/devlog"

id = "timonviola"                     # Shown in the header nav
blur_effect = true                    # Blur effect on the header bar
nav_separator = "::"
nav_wrapper_left = "{"
nav_wrapper_right = "} ;"
nav_wrapper_separator = ","

back_link_text = "Back"               # Text of the back button
force_theme = false                   # false | "light" | "dark"

footer_copyright = "© 2024 tmon"
footer_credits = true                 # Whether to show "Built with zola and serene" in footer

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

reaction = false                      # Whether to enable anonymous emoji reactions
